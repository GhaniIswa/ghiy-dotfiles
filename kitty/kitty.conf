# Display
background_opacity 0.75
background_blur 1
font_family		JetBrainsMono Nerd Font Mono
window_padding_width	8
cursor_shape beam
cursor_shape_unfocused underline
cursor_trail 4
cursor_trail_decay 0.1 0.4
